name: CI/CD Pipeline

on:
  push:
    branches:
      - main       # production
      - develop    # staging

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/devops-showcase
  AWS_REGION: us-east-1

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Run Tests
        run: |
          cd app
          npm install
          npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          cd app
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy-staging:
    needs: build-test-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Deploy with Terraform (Staging)
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="docker_image=$IMAGE_NAME:latest" \
            -var="environment=staging"

      - name: Get ALB URL
        working-directory: ./terraform
        run: |
          ALB_URL=$(terraform output -raw alb_dns_name)
          echo "ALB_URL=$ALB_URL" >> $GITHUB_ENV

      - name: Verify Deployment
        run: |
          echo "Waiting for deployment..."
          sleep 30
          for i in {1..10}; do
            if curl -f http://${{ env.ALB_URL }}/health; then
              echo "✅ Staging deployment successful!"
              exit 0
            fi
            echo "Attempt $i/10 - waiting..."
            sleep 15
          done
          exit 1

  deploy-production:
    needs: build-test-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Deploy with Terraform (Production)
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="docker_image=$IMAGE_NAME:latest" \
            -var="environment=production"

      - name: Get ALB URL
        working-directory: ./terraform
        run: |
          ALB_URL=$(terraform output -raw alb_dns_name)
          echo "ALB_URL=$ALB_URL" >> $GITHUB_ENV

      - name: Verify Deployment
        run: |
          echo "Waiting for deployment..."
          sleep 60
          for i in {1..15}; do
            if curl -f http://${{ env.ALB_URL }}/health; then
              echo "✅ Production deployment successful!"
              exit 0
            fi
            echo "Attempt $i/15 - waiting..."
            sleep 20
          done
          exit 1